<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="1" />
    </radialGradient>

    <!-- Text & Bar Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes fillBar {
        from { width: 0; }
        to { width: 620px; }
      }
      @keyframes shimmer {
        0% { stop-color: #34d399; }
        50% { stop-color: #38bdf8; }
        100% { stop-color: #34d399; }
      }
      .badge-glow { animation: pulse 3s infinite ease-in-out; }
      .live-dot { animation: blink 1.2s infinite; }
      .progress-active { animation: fillBar 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="880" height="360" rx="20" fill="url(#bgGlow)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Cyber Grid Lines -->
  <g stroke="#10b981" stroke-width="0.5" stroke-opacity="0.08">
    <line x1="10" y1="60" x2="890" y2="60" />
    <line x1="10" y1="120" x2="890" y2="120" />
    <line x1="10" y1="180" x2="890" y2="180" />
    <line x1="10" y1="240" x2="890" y2="240" />
    <line x1="10" y1="300" x2="890" y2="300" />
    <line x1="150" y1="10" x2="150" y2="370" />
    <line x1="300" y1="10" x2="300" y2="370" />
    <line x1="450" y1="10" x2="450" y2="370" />
    <line x1="600" y1="10" x2="600" y2="370" />
    <line x1="750" y1="10" x2="750" y2="370" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(315, 30)">
    <rect x="0" y="0" width="270" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="live-dot" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1.5">VERIFICATION COMPLETE</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Smart QoS Management Using SDN
  </text>
  <text x="450" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Ryu Controller &bull; OpenFlow 1.3 &bull; Open vSwitch Linux HTB
  </text>

  <!-- 100% Display -->
  <g transform="translate(450, 195)">
    <text x="-15" y="0" text-anchor="end" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="68" font-weight="900" fill="url(#neonGrad)" filter="url(#glow)">100</text>
    <text x="5" y="-12" text-anchor="start" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="38" font-weight="900" fill="#38bdf8">%</text>
  </g>

  <!-- Progress Bar Track -->
  <rect x="140" y="215" width="620" height="10" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  <!-- Progress Bar Fill -->
  <rect x="140" y="215" width="620" height="10" rx="5" fill="url(#neonGrad)" class="progress-active" filter="url(#glow)" />

  <!-- Metric Badges Row -->
  <g transform="translate(100, 250)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="160" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="80" y="22" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">LATENCY UNDER LOAD</text>
    <text x="80" y="44" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#34d399">0.135 ms</text>

    <!-- Card 2 -->
    <rect x="180" y="0" width="160" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="260" y="22" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">PACKET LOSS</text>
    <text x="260" y="44" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#34d399">0.0% (150/150)</text>

    <!-- Card 3 -->
    <rect x="360" y="0" width="160" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="440" y="22" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">DYNAMIC ADAPTATION</text>
    <text x="440" y="44" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="#34d399">+62.4% GAIN</text>

    <!-- Card 4 -->
    <rect x="540" y="0" width="160" height="56" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="620" y="22" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="0.5">SDN CONTROL PLANE</text>
    <text x="620" y="44" text-anchor="middle" font-family="monospace" font-size="14" font-weight="800" fill="#38bdf8">Ryu OpenFlow 1.3</text>
  </g>

  <!-- Footer Tag -->
  <text x="450" y="342" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b">
    PROJECT STATUS: <tspan fill="#38bdf8">READY FOR IEEE REPORT &amp; PRESENTATION PHASE</tspan>
  </text>
</svg>
